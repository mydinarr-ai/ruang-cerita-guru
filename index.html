<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruang Cerita Guru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f5; --card:#ffffff; --ink:#14202b; --muted:#5b6b7a; --line:#e3e9e7;
  --brand:#0d9488; --brand-d:#0f766e; --brand-dd:#115e59; --brand-l:#e0f5f1;
  --accent:#f59e0b; --accent-d:#b45309; --accent-l:#fff4dc;
  --danger:#c0392b; --ok:#15803d; --radius:18px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px rgba(16,40,50,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);
  background-image:radial-gradient(900px 420px at 85% -80px,#c9efe8 0%,transparent 70%),radial-gradient(700px 360px at -10% 0,#ffefc7 0%,transparent 65%);
  background-repeat:no-repeat;color:var(--ink);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 8px}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;
  padding:12px 4px;margin:0 -4px 6px;background:rgba(243,246,245,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--brand-dd);letter-spacing:-.3px;line-height:1.15}
.logo .mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;color:#fff;
  background:linear-gradient(135deg,#14b8a6,#0f766e);box-shadow:0 6px 14px rgba(15,118,110,.35)}
.logo small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.stepper{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:6px;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.stepper button{flex:1 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:7px 14px 7px 8px;
  border-radius:999px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap;transition:.15s}
.stepper button i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:#eef2f1;color:var(--muted)}
.stepper button:hover{border-color:var(--brand);color:var(--brand-dd)}
.stepper button.done:not(.on){color:var(--brand-dd)}
.stepper button.done:not(.on) i{background:var(--brand-l);color:var(--brand-d)}
.stepper button.on{background:linear-gradient(135deg,#14b8a6,#0f766e);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(15,118,110,.32)}
.stepper button.on i{background:rgba(255,255,255,.25);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:22px;letter-spacing:-.4px}
.card h3{margin:0 0 6px;font-size:16px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14.5px}
label{display:block;font-weight:700;font-size:13px;color:#2b3b49;margin:14px 0 5px}
input[type=text],textarea,select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:15px;background:#fbfdfc;color:var(--ink);transition:.15s}
textarea{min-height:80px;resize:vertical}
input:hover,textarea:hover,select:hover{border-color:#c8d4d1}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(13,148,136,.15)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.row{grid-template-columns:1fr}.card{padding:16px}}
button.btn{font:inherit;font-weight:700;font-size:14.5px;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,#14b8a6,#0f766e);box-shadow:0 4px 12px rgba(15,118,110,.28);transition:transform .12s,box-shadow .12s,filter .12s}
button.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(15,118,110,.34);filter:brightness(1.04)}
button.btn:active{transform:translateY(0)}
button.btn.alt{background:#fff;color:var(--brand-dd);border:1.5px solid #b7e1da;box-shadow:none}
button.btn.alt:hover{background:var(--brand-l);box-shadow:none}
button.btn.warn{background:#fff;color:var(--danger);border:1.5px solid #f3c6c0;box-shadow:none}
button.btn.warn:hover{background:#fdf0ee;box-shadow:none}
button.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
button.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;filter:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.spacer{flex:1}
.err{background:#fdf0ee;border:1px solid #f3c6c0;color:var(--danger);padding:12px 14px;border-radius:12px;margin-bottom:14px;font-size:14px}
.note{background:var(--accent-l);border:1px solid #f6dca0;border-left:4px solid var(--accent);padding:11px 14px;border-radius:12px;font-size:14px;margin:12px 0}
.okbox{background:var(--brand-l);border:1px solid #b7e1da;border-left:4px solid var(--brand);padding:11px 14px;border-radius:12px;font-size:14px;margin:12px 0}
.pipe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0;font-size:13px;font-weight:700}
.pipe span{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;color:var(--brand-dd)}
.pipe span i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;background:linear-gradient(135deg,#14b8a6,#0f766e)}
.pipe em{font-style:normal;color:#9fb0ad}
.ideas{display:grid;gap:12px;margin-top:14px}
.idea{border:1.5px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(180deg,#fff,#f8fbfa);transition:.15s}
.idea:hover{border-color:#9ad8cf;box-shadow:0 6px 18px rgba(15,118,110,.1)}
.idea b{display:block;margin-bottom:3px;font-size:15.5px}
.scene{border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:16px;padding:16px;margin-top:14px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.scene .hd{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.scene .no{background:linear-gradient(135deg,#14b8a6,#0f766e);color:#fff;border-radius:10px;min-width:34px;height:34px;display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:0 4px 10px rgba(15,118,110,.3)}
.dl{display:grid;grid-template-columns:130px 1fr auto;gap:8px;margin-top:6px;align-items:center}
@media(max-width:620px){.dl{grid-template-columns:1fr auto}.dl input:first-child{grid-column:1/-1}}
details{margin-top:12px;border:1.5px dashed #cfdad7;border-radius:12px;padding:9px 14px;background:#fafcfb}
details[open]{background:#fff}
details summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--brand-dd)}
.small{font-size:13px;color:var(--muted)}
.warnline{font-size:13px;color:var(--accent-d);margin-top:5px;min-height:18px}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:8px}
.styles label{margin:0;font-weight:500;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:#fff;transition:.15s}
.styles label:hover{border-color:#9ad8cf;transform:translateY(-1px)}
.styles label.on{border-color:var(--brand);background:var(--brand-l);box-shadow:0 0 0 3px rgba(13,148,136,.14)}
.styles input{display:none}
.styles b{display:block;font-size:14.5px;color:var(--ink)}
.styles span{font-size:12.5px;color:var(--muted)}
.pbox{position:relative;margin-top:10px}
.pbox textarea{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12.5px;line-height:1.55;min-height:100px;background:#f6f9f8;border-color:#dbe5e2}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.3px;padding:3px 10px;border-radius:999px;background:var(--brand-l);color:var(--brand-dd);margin:0 6px 4px 0}
.tag.v{background:var(--accent-l);color:var(--accent-d)}
.chips span{display:inline-block;background:#eef3f2;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600;margin:2px 5px 2px 0;color:#34495a}
.hero{position:relative;overflow:hidden;text-align:center;padding:44px 22px 36px;border:0;color:#fff;
  background:linear-gradient(135deg,#0d9488 0%,#0f766e 55%,#115e59 100%);box-shadow:0 18px 40px rgba(15,118,110,.32)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{width:300px;height:300px;right:-90px;top:-110px}
.hero::after{width:220px;height:220px;left:-70px;bottom:-100px;background:rgba(245,158,11,.22)}
.hero>*{position:relative;z-index:1}
.hero .badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:5px 14px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:.3px}
.hero h1{font-size:clamp(30px,6vw,44px);margin:14px 0 8px;letter-spacing:-1px;line-height:1.1}
.hero p{margin:0 auto;max-width:520px;font-size:16.5px;opacity:.95}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:26px auto 4px;max-width:720px;text-align:left}
.tiles div{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:12px 14px;font-size:13.5px}
.tiles b{display:block;font-size:14.5px;margin-bottom:2px}
.tiles i{font-style:normal;font-size:20px;display:block;margin-bottom:4px}
.hero button.btn{background:#fff;color:var(--brand-dd);box-shadow:0 8px 20px rgba(0,0,0,.2);padding:13px 24px;font-size:15.5px}
.hero button.btn.alt{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6);box-shadow:none}
.hero button.btn.alt:hover{background:rgba(255,255,255,.14)}
.flow li{margin-bottom:9px}
.flow ol,.flow ul{padding-left:22px}
.flow h3{margin-top:18px;color:var(--brand-dd)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px 8px 34px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14202b;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:50;box-shadow:0 10px 28px rgba(0,0,0,.3);max-width:92vw;text-align:center}
.modal{position:fixed;inset:0;background:rgba(10,25,30,.5);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:60;padding:16px}
.modal .box{background:#fff;border-radius:18px;padding:22px;max-width:400px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin:0;color:var(--ok)}
.chk input{width:auto}
.credit{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;color:var(--ink);font-weight:700;font-size:13.5px;text-align:left}
.credit img{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(16,40,50,.12)}
.credit small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.hero .by{display:inline-flex;align-items:center;gap:10px;margin-top:22px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 18px 6px 6px;font-size:13px;font-weight:600;text-align:left}
.hero .by img{width:38px;height:38px;border-radius:50%;background:#fff}
.hero .by small{display:block;font-weight:500;opacity:.85;font-size:11.5px}
.scene img,.pbox img{box-shadow:0 8px 22px rgba(16,40,50,.16)}
@media(max-width:700px){header.top{position:static;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}}
@media(max-width:600px){
  .wrap{padding:0 2px 6px}
  header.top{padding:8px 6px}
  .card{padding:14px;border-radius:14px;margin-bottom:10px}
  .hero{margin-top:4px!important;padding:26px 14px 22px;border-radius:16px}
  .tiles{grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
  .tiles div{padding:10px 11px;font-size:12.5px}
  .tiles b{font-size:13.5px}
  .hero .by{font-size:12.5px;padding:5px 16px 5px 5px}
  .stepper{padding:4px 4px 8px}
}
</style>
</head>

const SYSTEM = "Kamu adalah perancang pembelajaran dan sutradara video edukasi untuk guru di Indonesia. Materi harus akurat, sesuai jenjang, dan menarik. Jawab HANYA dengan JSON valid tanpa teks lain.";
function parseJSON(t){
  t = String(t||"").trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  return JSON.parse(t);
}
async function postApi(models,body,method){
  let last;
  for(const m of models){
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${m}:${method||"generateContent"}?key=${encodeURIComponent(apiKey())}`;
    for(let k=0;k<3;k++){
      let r;
      try{ r = await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); }
      catch(e){ last=new Error("tidak ada koneksi internet"); await sleep(Math.pow(2,k)*800); continue; }
      if(r.ok) return r.json();
      if(r.status===404){ last=new Error("model tidak tersedia (404)"); break; }
      if(r.status===400||r.status===401||r.status===403){
        let msg=""; try{ msg=(await r.json()).error.message||""; }catch(e){}
        const e=new Error("HTTP "+r.status+(msg?": "+msg.slice(0,140):""));
        e.auth = (r.status!==400) || /api key|API_KEY/i.test(msg);
        throw e;
      }
      last=new Error("HTTP "+r.status); await sleep(Math.pow(2,k)*1000);
    }
  }
  throw last||new Error("gagal");
}
async function gemini(prompt){
  const body = {
    contents:[{parts:[{text:prompt}]}],
    systemInstruction:{parts:[{text:SYSTEM}]},
    generationConfig:{responseMimeType:"application/json",temperature:0.9}
  };
  const j = await postApi(MODELS,body);
  const t = j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts[0].text;
  if(!t) throw new Error("Respons kosong");
  return parseJSON(t);
}

async function imagenGen(prompt,ratio){
  try{
    const j = await postApi(["imagen-4.0-generate-001"],{instances:[{prompt}],parameters:{sampleCount:1,aspectRatio:ratio}},"predict");
    const b = j.predictions && j.predictions[0] && j.predictions[0].bytesBase64Encoded;
    if(!b) throw new Error("gambar kosong");
    return "data:image/png;base64,"+b;
  }catch(e){
    if(e.auth) throw e;
    throw new Error("pembuat gambar belum tersedia ("+(e.message||"")+"). Buat gambarnya langsung di Flow, lalu unggah di sini");
  }
}
async function genImage(prompt,ratio,refs){
  refs = (refs||[]).filter(Boolean).slice(0,3);
  const parts = [];
  refs.forEach(r=>{ const m=/^data:(.+?);base64,(.+)$/.exec(r); if(m) parts.push({inlineData:{mimeType:m[1],data:m[2]}}); });
  parts.push({text:(parts.length?"Use the attached reference image(s) to keep every character exactly the same: face, hair, skin tone, clothing and colors. ":"")+prompt+" Output image aspect ratio "+ratio+"."});
  const body = {contents:[{parts}],generationConfig:{responseModalities:["IMAGE"]}};
  try{
    const j = await postApi(IMG_MODELS,body);
    const ps = (j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
    const im = ps.find(x=>x.inlineData||x.inline_data);
    const d = im && (im.inlineData||im.inline_data);
    if(!d || !d.data) throw new Error("gambar kosong");
    return "data:"+(d.mimeType||d.mime_type||"image/png")+";base64,"+d.data;
  }catch(e){
    if(e.auth) throw e;
    return imagenGen(prompt,ratio); // cadangan: tanpa referensi
  }
}

    ${p.chars.length?p.chars.map((c,i)=>`<div class="pbox"><b style="font-size:14px">${esc(c.nama)}</b><textarea readonly id="sheetp-${i}">${esc(sheetPrompt(c))}</textarea><div class="actions" style="margin-top:6px">${btn("copyEl","Salin","sm",`data-el="sheetp-${i}"`)}</div></div>`).join(""):`<div class="note">Belum ada karakter. Buat di langkah 3.</div>`}

    ${p.chars.some((c,i)=>S.imgs[i])?"":`<div class="note">Belum ada gambar character sheet. Buat atau unggah dulu di langkah 3 agar tokoh di semua gambar adegan konsisten.</div>`}

    ${p.scenes.map((sc,i)=>`<div class="scene"><div class="hd"><div class="no">${i+1}</div><b style="flex:1">${esc(sc.judul)}</b><label class="chk"><input type="checkbox" data-done="${i}" ${sc.done?"checked":""}>Selesai</label></div>

function stepGuide(){
  return `<div class="card flow"><h2>Cara pakai Google Flow</h2><p class="sub">Tampilan Flow bisa berubah dari waktu ke waktu. Nama menu di bawah mungkin sedikit berbeda.</p>
    ${ORDER_BAR}
    <h3>A. Persiapan</h3><ol>
      <li>Cari <b>Google Flow</b> (Google Labs) di browser, lalu masuk dengan akun Google.</li>
      <li>Buat <b>proyek baru</b> dan beri nama sesuai judul video. Satu proyek untuk satu video.</li>
      <li>Kuota gratis terbatas per hari atau bulan. Kerjakan beberapa adegan per hari bila perlu. Proyek tetap tersimpan di app ini.</li>
    </ol>
    <h3>B. Buat karakter</h3><ol>
      <li>Di app ini buka langkah 4 atau 5, salin <b>prompt character sheet</b> tiap tokoh.</li>
      <li>Di Flow, tempel prompt ke pembuat gambar, atur rasio sesuai pilihan Anda, lalu generate.</li>
      <li>Pilih hasil terbaik. Pastikan wajah, rambut, dan pakaian sudah sesuai. Ulangi bila belum cocok.</li>
    </ol>
    <h3>C. Buat gambar tiap adegan</h3><ol>
      <li>Salin <b>prompt gambar</b> adegan 1.</li>
      <li>Di Flow, tambahkan gambar character sheet sebagai <b>gambar referensi</b> (fitur bahan/ingredients), lalu tempel prompt dan generate.</li>
      <li>Pilih hasil yang paling mirip karakter. Ulangi untuk adegan berikutnya.</li>
    </ol>
    <h3>D. Jadikan video</h3><ol>
      <li>Pilih gambar adegan sebagai <b>frame awal</b> (image-to-video).</li>
      <li>Tempel <b>prompt video + suara</b> dari app ini, lalu generate. Dialog dalam tanda kutip akan diucapkan tokoh.</li>
      <li>Putar hasilnya. Periksa gerak, wajah, dan suara. Bila bermasalah, perpendek dialog atau generate ulang.</li>
      <li>Unduh klip, lalu centang adegan itu di langkah 4 app ini.</li>
    </ol>
    <h3>Tips agar hasil bagus</h3><ul>
      <li>Selalu pakai gambar character sheet sebagai referensi supaya tokoh konsisten.</li>
      <li>Jangan minta tulisan di dalam gambar. Teks sering rusak. Tambahkan "teks di layar" (kolom di storyboard) di editor video seperti CapCut atau Canva.</li>
      <li>Atur durasi klip di Flow sama dengan durasi adegan di app ini.</li>
      <li>Dialog bahasa Indonesia bisa kurang pas pengucapannya. Bila perlu, hapus dialog dari prompt video dan rekam suara sendiri dari naskah.</li>
      <li>Satu adegan, satu aksi. Prompt sederhana biasanya lebih stabil.</li>
    </ul></div>`;
}

  let h = "";
  if(S.toast) h += `<div class="toast">${esc(S.toast)}</div>`;
  if(S.confirm) h += `<div class="modal"><div class="box"><p style="margin-top:0">${esc(S.confirm.msg)}</p><div class="actions" style="justify-content:flex-end"><button class="btn alt" data-act="cNo">Batal</button><button class="btn" data-act="cYes">Ya, lanjut</button></div></div></div>`;
  if(S.keyDlg) h += `<div class="modal"><div class="box"><h3 style="margin:0 0 6px">Kunci AI (gratis)</h3>
    <p class="small" style="margin:0 0 8px">Jika dibuka lewat Gemini Canvas, kunci tidak perlu diisi. Jika dibuka dari halaman web biasa, isi kunci Gemini gratis milik Anda sendiri:</p>
    <ol class="small" style="padding-left:18px;margin:0 0 10px"><li>Buka <b>aistudio.google.com/apikey</b>, masuk dengan akun Google.</li><li>Klik <b>Create API key</b>, lalu salin kuncinya.</li><li>Tempel di bawah dan simpan.</li></ol>
    <input type="text" id="keyInput" placeholder="AIza..." autocomplete="off" value="${esc(oldV||apiKey())}">
    <p class="small" style="margin:8px 0 0">Kunci hanya disimpan di browser Anda dan dikirim langsung ke Google, tidak ke pihak lain.</p>
    <div class="actions" style="justify-content:flex-end"><button class="btn warn sm" data-act="keyClear">Hapus kunci</button><button class="btn alt" data-act="keyClose">Tutup</button><button class="btn" data-act="keySave">Simpan</button></div></div></div>`;
  if(S.lightbox) h += `<div class="modal" style="align-items:start;overflow:auto"><div class="box" style="max-width:520px;margin:auto"><img src="${S.lightbox.src}" alt="Gambar" style="width:100%;border-radius:12px;display:block;-webkit-touch-callout:default;user-select:auto">
    <p class="small" style="margin:10px 0">Tekan dan tahan gambar di atas, lalu pilih <b>Simpan gambar</b> / <b>Unduh gambar</b>.</p>
    <div class="actions" style="justify-content:flex-end;margin-top:6px"><button class="btn alt sm" data-act="lbDl">Coba unduh langsung</button><button class="btn" data-act="lbClose">Tutup</button></div></div></div>`;
  document.getElementById("overlay").innerHTML = h;
}

/* ================== EVENTS ================== */
document.addEventListener("input",e=>{
  const t = e.target;
  if(t.dataset.b===undefined || t.type==="radio") return;
  let v = t.value;
  if(t.dataset.list) v = v.split(",").map(x=>x.trim()).filter(Boolean);
  setPath(S.p,t.dataset.b,v);
  const m = t.dataset.b.match(/^scenes\.(\d+)\.dialog/);
  if(m){ const el=document.getElementById("warn-"+m[1]); if(el) el.textContent = warnText(S.p.scenes[+m[1]]); }
  if(t.dataset.b==="meta.topik"){ const b=document.querySelector('[data-act="ideas"]'); if(b && !S.busy) b.disabled = !String(v).trim(); }
  if(t.dataset.b==="ide.judul"){ const b=document.querySelector('[data-act="story"]'); if(b && !S.busy) b.disabled = !String(v).trim(); }
  if(t.dataset.sheet!==undefined){ const el=document.getElementById("sheet-"+t.dataset.sheet); if(el) el.value = sheetPrompt(S.p.chars[+t.dataset.sheet]); }
  save();
});
document.addEventListener("change",e=>{
  const t = e.target;
  if(t.dataset.done!==undefined){ S.p.scenes[+t.dataset.done].done = t.checked; save(); render(); return; }
  if(t.dataset.b===undefined) return;
  let v = t.value; if(t.dataset.num) v = parseFloat(v);
  setPath(S.p,t.dataset.b,v); save();
  if(t.dataset.rerender || t.tagName==="SELECT") render();
});
document.addEventListener("click",e=>{
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  if(b.tagName==="A") e.preventDefault();
  const a = b.dataset.act, i = +b.dataset.i, j = +b.dataset.j, p = S.p;
  switch(a){
    case "start": p.started=true; save(); render(); break;
    case "goto": S.step=i; S.err=""; save(); render(); break;
    case "pickIdea": { const x=p.ideas[i]; p.ide={judul:x.judul,sinopsis:x.sinopsis+(x.hook?" Pembuka: "+x.hook:"")}; p.tokoh=x.tokohSaran||[]; save(); render(); showToast("Ide dipilih"); break; }
    case "ideas": run("Membuat ide...",genIdeas); break;
    case "story": {
      const go = ()=>run("Menyusun storyboard...",genStoryboard);
      p.scenes.length ? ask("Storyboard lama akan diganti. Lanjutkan?",go) : go(); break; }
    case "regen": run("Menulis ulang "+(i+1),()=>regenScene(i)); break;
    case "up": [p.scenes[i-1],p.scenes[i]]=[p.scenes[i],p.scenes[i-1]]; save(); render(); break;
    case "down": [p.scenes[i+1],p.scenes[i]]=[p.scenes[i],p.scenes[i+1]]; save(); render(); break;
    case "delScene": ask("Hapus adegan "+(i+1)+"?",()=>{p.scenes.splice(i,1);save();render();}); break;
    case "addScene": p.scenes.push(normScene({judul:"Adegan baru",dialog:[{tokoh:"Narator",teks:""}]})); save(); render(); break;
    case "addLine": p.scenes[i].dialog.push({tokoh:"Narator",teks:""}); save(); render(); break;
    case "delLine": p.scenes[i].dialog.splice(j,1); save(); render(); break;
    case "chars": {
      const go = ()=>run("Merancang karakter...",genChars);
      p.chars.length ? ask("Karakter lama akan diganti. Lanjutkan?",go) : go(); break; }
    case "addChar": p.chars.push({nama:"Tokoh baru",peran:"",deskripsi_en:"",ide:""}); save(); render(); break;
    case "delChar": p.chars.splice(i,1); S.imgs={}; S.sugg={}; save(); render(); break;
    case "suggest": run("Membuat saran "+i,()=>charSuggest(i)); break;
    case "fromIdea": run("Membuat deskripsi "+i,()=>charFromIdea(i)); break;
    case "useSugg": p.chars[i].deskripsi_en = S.sugg[i][+b.dataset.k].deskripsi_en; save(); render(); showToast("Deskripsi dipakai"); break;
    case "sceneImg": run("Gambar adegan "+i,()=>sceneImage(i)); break;
    case "upImg": pickImage(i,"simgs"); break;
    case "upSheet": pickImage(i,"imgs"); break;
    case "allImg": run("Semua gambar",allImages); break;
    case "dlSceneImg": imgOut(S.simgs[i],"adegan-"+String(i+1).padStart(2,"0")+".png"); break;
    case "dlCards": download("kartu-adegan-"+slug(p.ide.judul)+".html",buildCards(),"text/html"); break;
    case "charImg": run("Membuat gambar "+i,()=>charImage(i)); break;
    case "dlImg": imgOut(S.imgs[i],"karakter-"+slug(p.chars[i].nama)+".png"); break;
    case "copyEl": { const el=document.getElementById(b.dataset.el); if(el) copyText(el.value); break; }
    case "copyAll": copyText(p.scenes.map((sc,n)=>`ADEGAN ${n+1}\n${b.dataset.k==="img"?imagePrompt(sc):videoPrompt(sc)}`).join("\n\n")); break;
    case "resetP": p.scenes[i][b.dataset.k]=null; save(); render(); break;
    case "dlPrompts": download("prompt-"+slug(p.ide.judul)+".txt",buildPrompts()); break;
    case "dlScript": download("naskah-"+slug(p.ide.judul)+".txt",buildScript()); break;
    case "copyPrompts": copyText(buildPrompts()); break;
    case "copyScript": copyText(buildScript()); break;
    case "exportProject": download("proyek-"+slug(p.ide.judul)+".json",JSON.stringify(p,null,2),"application/json"); break;
    case "importProject": pickFile(); break;
    case "newProject": ask("Mulai proyek baru? Proyek sekarang akan dihapus dari browser. Simpan dulu bila perlu.",()=>{S.p=newProject();S.p.started=true;S.step=0;save();render();}); break;
    case "cYes": { const f=S.confirm&&S.confirm.fn; S.confirm=null; renderOverlay(); if(f) f(); break; }
    case "cNo": S.confirm=null; renderOverlay(); break;
    case "keyOpen": S.keyDlg=true; renderOverlay(); break;
    case "keyClose": S.keyDlg=false; renderOverlay(); break;
    case "keySave": { const v=(document.getElementById("keyInput")||{}).value||""; setApiKey(v.trim()); S.keyDlg=false; S.err=""; renderOverlay(); render(true); showToast(v.trim()?"Kunci disimpan":"Kunci dihapus"); break; }
    case "keyClear": setApiKey(""); S.keyDlg=false; renderOverlay(); showToast("Kunci dihapus"); break;
    case "lbClose": S.lightbox=null; renderOverlay(); break;
    case "lbDl": if(S.lightbox) saveImage(S.lightbox.src,S.lightbox.name); break;
  }
});
// Di HP: tampilkan gambar di dalam app (tanpa pindah halaman) agar progres tidak hilang; di laptop: unduh langsung.
function imgOut(dataUrl,name){
  const touch = window.matchMedia && matchMedia("(pointer:coarse)").matches;
  if(touch){ S.lightbox={src:dataUrl,name}; renderOverlay(); }
  else saveImage(dataUrl,name);
}
function saveImage(dataUrl,name){
  try{
    const m = /^data:(.+?);base64,(.+)$/.exec(dataUrl);
    const bin = atob(m[2]), arr = new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++) arr[k]=bin.charCodeAt(k);
    const url = URL.createObjectURL(new Blob([arr],{type:m[1]}));
    const a = document.createElement("a"); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    showToast("Gambar diunduh. Jika tidak muncul, klik kanan gambar > Simpan gambar.");
  }catch(e){
    showToast("Unduh diblokir browser. Klik kanan gambar > Simpan gambar sebagai.");
  }
}
function pickImage(i,store){
  const inp = document.createElement("input"); inp.type="file"; inp.accept="image/*";
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ S[store][i]=r.result; save(); render(true); showToast("Gambar dipasang"); };
    r.readAsDataURL(f);
  };
  inp.click();
}
function buildCards(){
  const p=S.p, e=esc;
  const cards = p.scenes.map((sc,i)=>`<section><h2>Adegan ${i+1}: ${e(sc.judul)} <small>(${sc.detik||8} detik)</small></h2>
${S.simgs[i]?`<img src="${S.simgs[i]}" alt="Adegan ${i+1}">`:`<div class="ph">Gambar belum ada</div>`}
<h3>Prompt video (salin ke Omni)</h3><pre>${e(videoPrompt(sc))}</pre>
${sc.layar?`<p class="ov">Teks di layar (tambahkan di editor): <b>${e(sc.layar)}</b></p>`:""}
<details><summary>Prompt gambar</summary><pre>${e(imagePrompt(sc))}</pre></details></section>`).join("\n");
  return `<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${e(p.ide.judul)} - Kartu adegan</title>
<style>body{font-family:system-ui,sans-serif;max-width:820px;margin:0 auto;padding:16px;color:#1f2a37;background:#f6f3ec}section{background:#fff;border:1px solid #e4dfd3;border-radius:14px;padding:16px;margin:16px 0;page-break-inside:avoid}h1{color:#0b5a54}h2{margin:0 0 8px;font-size:18px}h2 small{color:#667085;font-weight:400}h3{font-size:14px;margin:12px 0 4px}img{max-width:100%;max-height:520px;border-radius:12px;display:block}.ph{background:#eef2f1;border-radius:12px;padding:30px;text-align:center;color:#667085}pre{white-space:pre-wrap;word-wrap:break-word;background:#fbfaf6;border:1px solid #e4dfd3;border-radius:10px;padding:12px;font-size:13px;margin:0}.ov{background:#fdf0d9;border-radius:8px;padding:8px 10px;font-size:14px}</style></head><body>
<h1>${e(p.ide.judul)}</h1><p>${e(p.meta.mapel)} | ${e(p.meta.jenjang)} | Gaya ${e(STYLES[p.gaya].l)} | Rasio ${e(p.meta.rasio)}</p>
${cards}</body></html>`;
}
function pickFile(){
  const inp = document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const d = JSON.parse(r.result);
        if(!d.meta || !Array.isArray(d.scenes)) throw new Error("format");
        S.p = Object.assign(newProject(),d); S.p.started=true; S.step=0; save(); render(); showToast("Proyek dibuka");
      }catch(e){ showToast("File bukan proyek Ruang Cerita Guru."); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ================== MULAI ================== */
load();
render();
restoreImgs();
</script>
